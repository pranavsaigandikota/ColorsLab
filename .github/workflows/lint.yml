name: Lint and tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint HTML, CSS, and JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint HTML
        run: npm run lint:html

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint JavaScript
        run: npm run lint:js

  tests:
    name: Jest unit and LAMP integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for testing tools
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check PHP syntax
        run: find api tests/support -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Start disposable Apache, PHP, and MySQL test stack
        run: docker compose -p colorslab-tests -f compose.test.yml up --build --wait --wait-timeout 180

      - name: Run unit and integration tests
        run: npm test -- --ci

      - name: Show container logs on failure
        if: failure()
        run: docker compose -p colorslab-tests -f compose.test.yml logs --no-color

      - name: Remove test containers
        if: always()
        run: docker compose -p colorslab-tests -f compose.test.yml down --volumes
