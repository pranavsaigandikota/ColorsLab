services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: test_root_password
      MYSQL_DATABASE: COP4331
      MYSQL_USER: colors_test
      MYSQL_PASSWORD: colors_test_password
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./tests/support/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u colors_test COP4331 -e 'SELECT COUNT(*) FROM Users'"]
      interval: 3s
      timeout: 5s
      retries: 40
  web:
    build:
      context: .
      dockerfile: tests/support/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/index.html"]
      interval: 3s
      timeout: 5s
      retries: 20
